name: Kasi Framework CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-verify:
    name: Build & Test Suite Execution
    runs-on: ubuntu-latest
    
    steps:
    # 1. FIXED: Upgraded from @v4 to @v5 to eliminate the Node.js deprecation warning
    - name: Checkout Source Code
      uses: actions/checkout@v5

    # 2. FIXED: Upgraded from @v2 to @v4 to target Node.js 24 natively
    - name: Setup Secure Rust Toolchain Environment
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: clippy, rustfmt

    - name: Enable Cargo Dependency Caching
      uses: swatinem/rust-cache@v2

    - name: Validate Source Code Formatting Alignment
      run: cargo fmt --all -- --check

    # - name: Execute Workspace Static Code Analysis (Clippy)
    #   run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Execute High-Fidelity Test Simulator Suite
      run: cargo test --workspace --all-targets

  publish-to-crates-io:
    name: Deploy to Crates.io
    needs: test-and-verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v5

    - name: Setup Stable Deployment Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Publish Step 1 - kasi-core
      run: |
        cargo publish --manifest-path kasi-core/Cargo.toml --all-features
        echo "Waiting 30 seconds for Crates.io index synchronization caches..."
        sleep 30

    - name: Publish Step 2 - kasi-security
      run: |
        cargo publish --manifest-path kasi-security/Cargo.toml
        echo "Waiting 30 seconds for Crates.io index synchronization caches..."
        sleep 30

    - name: Publish Step 3 - kasi-macros
      run: |
        cargo publish --manifest-path kasi-macros/Cargo.toml
        echo "Waiting 30 seconds for Crates.io index synchronization caches..."
        sleep 30

    - name: Publish Step 4 - Top-Level Umbrella Crate (kasi-jb)
      run: |
        cargo publish --manifest-path Cargo.toml

