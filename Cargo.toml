[workspace]
resolver = "2"
members = [
    ".",
    "kasi-core",
    "kasi-macros",
    "kasi-security",
]

[workspace.package]
version = "0.1.8"
edition = "2024"
authors = ["Justice Sam <fjaccobian@gmail.com>"]
license = "MIT"
repository = "https://github.com"
description = "An enterprise-grade, compile-time optimized async microservice framework built on Hyper 1.x and Tokio."
documentation = "https://docs.rs"
keywords = ["web", "async", "hyper", "framework", "microservice"]
categories = ["web-programming::http-server", "asynchronous"]
readme = "README.md"

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
hyper = { version = "1.12.0", features = ['full'] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio"] }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
http = "1.5.0"
bytes = "1.12.1"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
nom = "8.0.0"
regex = "1.13.1"

syn = { version = "3.0.9", features = ["full", "extra-traits"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
proc-macro-error = "1.0.4"

sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono"] }
sea-orm = { version = "2.0.4", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
oauth2 = "5.0.0"
openidconnect = "4.1.0"
jsonwebtoken = { version = "11.1.0" }
minijinja = { version = "3.0.5" }
minijinja-embed = { version = "3.0.5" }
uuid = { version = "1.29.0", features = ["v4", "serde"]}

kasi-core = { version = "0.1.8", path = "./kasi-core" }
kasi-security = { version = "0.1.8", path = "./kasi-security" }
kasi-macros = { version = "0.1.8", path = "./kasi-macros" }

[package]
name = "kasi-jb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
documentation = "https://docs.rs"
keywords = ["web", "async", "hyper", "framework", "microservice"]
categories = ["web-programming::http-server", "asynchronous"]
readme = "README.md"

[dependencies]
kasi-core = { workspace = true }
kasi-macros = { workspace = true }
kasi-security = { workspace = true }

http-body-util = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }

# Inherit from [workspace.dependencies] to make them visible in this crate's code
http = { workspace = true }
hyper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Activated conditionally under feature propagation boundaries
sqlx = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }

[dev-dependencies]
reqwest = { version = "0.12.5", features = ["json"] } 

[features]
default = ["postgres", "templates"]
postgres = ["kasi-core/postgres", "dep:sqlx", "dep:sea-orm"]
templates = []
