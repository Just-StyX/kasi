[package]
name = "kasi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The core execution engine, async request extractors, and HTTP runtime routing components for the Kasi web framework."
authors = ["Justice Sam <fjaccobian@gmail.com>"]
repository = "https://github.com"
documentation = "https://docs.rs"
keywords = ["web", "async", "hyper", "framework", "microservice"]
categories = ["web-programming::http-server", "asynchronous"]

[dependencies]
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tower.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
nom.workspace = true
regex.workspace = true
bytes.workspace = true
uuid.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
sha1.workspace = true
base64.workspace = true

# Optional engines enabled conditionally under feature propagation boundaries
sqlx = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
minijinja = { workspace = true, optional = true }
minijinja-embed = { workspace = true, optional = true }

[dev-dependencies]
reqwest = { version = "0.12.5", features = ["json"] }

[features]
postgres = ["dep:sea-orm", "dep:sqlx"]
templates = ["dep:minijinja", "dep:minijinja-embed"]
